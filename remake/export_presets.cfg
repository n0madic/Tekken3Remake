; Export presets: each platform in a full build, a nomovies build (music, no movies) and a lite build
; (neither music nor movies).
; The converted assets in imported/ are packed into the PCK; JSON and binary data (*.bin, *.bin.gz) are not
; Godot resources, so the include filter adds them. Builds contain converted game data
; and are private (docs/remake-plan.md#content-pipeline). Full builds keep one movie variant:
; desktop the large one, web the small one (`.ogv` is not imported, so it is included by name).
; Android and iOS keep the small movies, as the web does. Android builds are signed at export with
; the keystore given in GODOT_ANDROID_KEYSTORE_RELEASE_PATH / _USER / _PASSWORD (no credentials are
; stored here); iOS exports an Xcode project, signed and built in Xcode with the owner's team (the
; team id here is a placeholder Godot requires).

[preset.0]

name="macOS full"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, *.bin, *.gz, *.ogv, *.tims"
exclude_filter="tests/*, dev/*, imported/movies/*.small.ogv"
export_path="export/macos-full/Tekken3Remake.zip"

[preset.0.options]

application/bundle_identifier="local.tekken3.remake"
application/short_version="0.1"
application/version="0.1"
codesign/codesign=0

